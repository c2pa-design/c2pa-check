[workspace]
members = ["crates/c2pa-check-core", "crates/c2pa-check"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/c2pa-design/c2pa-check"
homepage = "https://c2pa.design"

[workspace.dependencies]
c2pa = { version = "=0.90.20", features = ["file_io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rcgen = "0.13"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
