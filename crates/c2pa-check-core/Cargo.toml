[package]
name = "c2pa-check-core"
description = "Normalized C2PA verification: one result document shared by the CLI, the browser and the c2pa.design API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
c2pa.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
image.workspace = true
rcgen.workspace = true
libheif-rs = { version = "2", optional = true }
mp4parse = { version = "0.17", optional = true }
pem = "3"
getrandom = "0.3"

[features]
default = ["bundled-trust-list"]
bundled-trust-list = []
avif = ["image/avif-native", "dep:mp4parse"]
heic = ["dep:libheif-rs"]
