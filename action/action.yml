name: c2pa-check
description: Verify Content Credentials on files and production URLs, and fail the build when provenance disappears.
author: c2pa.design
branding:
  icon: shield
  color: green

inputs:
  paths:
    description: Glob of files to verify, e.g. "public/**/*.{jpg,png,webp}".
    required: false
    default: ""
  urls:
    description: Newline-separated production URLs to verify after a deploy.
    required: false
    default: ""
  coverage:
    description: Fail when fewer than this percentage of targets are trusted.
    required: false
    default: "100"
  expect:
    description: present | trusted | absent
    required: false
    default: ""
  trust:
    description: official | interim | both | none
    required: false
    default: official
  format:
    description: text | json | junit
    required: false
    default: text
  carry:
    description: "true to carry Content Credentials from originals in from-dir into the converted files matched by paths before checking."
    required: false
    default: "false"
  from-dir:
    description: Folder of signed originals, paired with the converted files by file name (with carry).
    required: false
    default: ""
  output:
    description: "Write the report to this file instead of the log (e.g. c2pa-check.xml with format junit). Empty prints to the log."
    required: false
    default: ""
  version:
    description: Release tag of c2pa-check to run (e.g. v0.2.0), or latest.
    required: false
    default: v0.2.0

outputs:
  coverage:
    description: Percentage of targets a verifier would call trusted; empty unless format is text.
    value: ${{ steps.check.outputs.coverage }}

runs:
  using: composite
  steps:
    - name: Install c2pa-check
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="$INPUT_VERSION"
        if [ "$version" = "latest" ]; then
          version=$(curl -fsSL https://api.github.com/repos/c2pa-design/c2pa-check/releases/latest | jq -r .tag_name)
        fi
        arch=$(uname -m)
        case "$arch" in
          x86_64) target=x86_64-unknown-linux-musl ;;
          aarch64|arm64) target=aarch64-unknown-linux-musl ;;
          *) echo "unsupported architecture $arch" >&2; exit 1 ;;
        esac
        base="https://github.com/c2pa-design/c2pa-check/releases/download/${version}"
        tmp=$(mktemp -d)
        curl -fsSL -o "$tmp/c2pa-check-${target}.tar.gz" "$base/c2pa-check-${target}.tar.gz"
        curl -fsSL -o "$tmp/SHA256SUMS" "$base/SHA256SUMS"
        (cd "$tmp" && grep " c2pa-check-${target}.tar.gz\$" SHA256SUMS | sha256sum -c -)
        tar xzf "$tmp/c2pa-check-${target}.tar.gz" -C /usr/local/bin c2pa-check
        c2pa-check --version

    - name: Carry Content Credentials
      if: ${{ inputs.carry == 'true' }}
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_FROM_DIR: ${{ inputs.from-dir }}
      run: |
        set -uo pipefail
        if [ -z "$INPUT_PATHS" ] || [ -z "$INPUT_FROM_DIR" ]; then
          echo "::error::carry needs paths and from-dir"
          exit 2
        fi
        c2pa-check carry "$INPUT_PATHS" --from-dir "$INPUT_FROM_DIR" --json > carry.json
        status=$?
        {
          echo "### Content Credentials carried"
          echo
          echo "| File | Status | Signer | Rule or credential |"
          echo "|---|---|---|---|"
          jq -r '(if type == "array" then .[] else . end) | "| \(.output // .derived) | \(.status) | \(.signer // "") | \(.rule // .credential_status // .message // "") |"' carry.json
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$status" -eq 5 ]; then
          echo "::error::carry was refused for at least one file (see rule in the job summary)."
        elif [ "$status" -ne 0 ]; then
          echo "::error::carry failed for at least one file. See the job summary."
        fi
        exit "$status"

    - name: Check provenance
      id: check
      shell: bash
      env:
        INPUT_TRUST: ${{ inputs.trust }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_COVERAGE: ${{ inputs.coverage }}
        INPUT_EXPECT: ${{ inputs.expect }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_URLS: ${{ inputs.urls }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set -uo pipefail
        args=(--trust "$INPUT_TRUST" --format "$INPUT_FORMAT")
        if [ -n "$INPUT_COVERAGE" ]; then args+=(--coverage "$INPUT_COVERAGE"); fi
        if [ -n "$INPUT_EXPECT" ]; then args+=(--expect "$INPUT_EXPECT"); fi
        if [ -n "$INPUT_OUTPUT" ]; then args+=(--output "$INPUT_OUTPUT"); fi

        targets=()
        if [ -n "$INPUT_PATHS" ]; then targets+=("$INPUT_PATHS"); fi
        while IFS= read -r url; do
          [ -n "$url" ] && targets+=("$url")
        done <<< "$INPUT_URLS"

        if [ ${#targets[@]} -eq 0 ]; then
          echo "::error::give the action paths or urls"
          exit 2
        fi

        c2pa-check "${args[@]}" "${targets[@]}" | tee result.txt
        status=${PIPESTATUS[0]}

        coverage=""
        if [ "$INPUT_FORMAT" = "text" ]; then
          coverage=$(grep -oE 'coverage [0-9.]+' result.txt | tail -1 | awk '{print $2}' || true)
        fi
        echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

        if [ "$status" -eq 1 ]; then
          echo "::error::Content Credentials are missing or untrusted. See the list above."
        fi
        exit "$status"
