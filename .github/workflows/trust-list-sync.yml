name: trust-list-sync

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/fetch-trust-list.sh
      - uses: peter-evans/create-pull-request@v7
        with:
          title: "trust list: upstream snapshot"
          commit-message: "trust list: refresh bundled snapshot"
          branch: trust-list-sync
          body: |
            The upstream C2PA trust list changed. Merging this ships a release with the new
            anchors; `--offline` builds keep the previous snapshot until they upgrade.
