name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }} -p c2pa-check
      - uses: actions/upload-artifact@v6
        with:
          name: c2pa-check-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/c2pa-check*

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - run: node npm/publish.mjs dist "${GITHUB_REF_NAME#v}" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm provenance and integrity
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 30); do
            npm view "c2pa-check@$version" version >/dev/null 2>&1 && break
            sleep 10
          done
          mkdir verify && cd verify && npm init -y >/dev/null
          npm install --no-save "c2pa-check@$version"
          npm audit signatures
          npm view "c2pa-check@$version" dist.integrity

  github:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Package
        run: |
          set -euo pipefail
          mkdir out
          for dir in dist/c2pa-check-*; do
            name=$(basename "$dir")
            if [ -f "$dir/c2pa-check.exe" ]; then
              (cd "$dir" && zip -q "../../out/$name.zip" c2pa-check.exe)
            else
              chmod +x "$dir/c2pa-check"
              tar czf "out/$name.tar.gz" -C "$dir" c2pa-check
            fi
          done
          (cd out && sha256sum * > SHA256SUMS)
          cat out/SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/c2pa-check-*
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/* --clobber

  tap:
    needs: github
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Skip without a tap token
        if: env.TAP_TOKEN == ''
        run: echo "::notice::TAP_TOKEN is not set; the Homebrew formula was not updated"
      - uses: actions/checkout@v5
        if: env.TAP_TOKEN != ''
        with:
          repository: c2pa-design/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
      - name: Point the formula at this release
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i -E "s|^  url \".*\"|  url \"$url\"|; s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/c2pa-check.rb
          if git diff --quiet; then
            echo "::notice::the formula already points at ${GITHUB_REF_NAME}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "c2pa-check ${GITHUB_REF_NAME#v}"
          git push
